{% set name = "epiresim" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/lescailab/EpiReSIM_conversion/archive/ee533919f564148f1f9d6e48e18388b1714f9f7e.tar.gz
  sha256: 3914d1323722fd2e0d427badccc36aaa7ff6cef71cb204adc52c7731fefaa332

build:
  noarch: python
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - epiresim = epiresim.cli:main

requirements:
  host:
    - python >=3.11
    - pip
    - hatchling >=1.27
  run:
    - python >=3.11
    - numpy >=1.26,<3
    - scipy >=1.12,<2

test:
  imports:
    - epiresim
  commands:
    - epiresim --help
    - python -c "from epiresim import genotype_probabilities; assert abs(genotype_probabilities([0.2, 0.3]).sum() - 1.0) < 1e-12"

about:
  home: https://github.com/lescailab/EpiReSIM_conversion
  license: MIT
  license_file: LICENSE
  summary: Python rewrite of EpiReSIM with recorded MATLAB compatibility testing
  description: |
    This package rewrites the EpiReSIM method and software published by Shang
    et al. (Genes 2022, doi:10.3390/genes13122286). It simulates case-control
    SNP matrices containing epistatic models without marginal effects, using
    penetrance constraints and fragment resampling from reference genotypes.
    Compatibility claims are limited to the environments and scenarios in the
    linked validation report.
  doc_url: https://lescailab.github.io/EpiReSIM_conversion/
  dev_url: https://github.com/lescailab/EpiReSIM_conversion

extra:
  recipe-maintainers:
    - lescai
