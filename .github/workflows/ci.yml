name: CI

on:
  push:
    branches: [main, dev, devel]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: ruff check src tests
      - run: mypy --python-version "${{ matrix.python }}" src/epiresim
      - run: pytest --cov=epiresim --cov-report=term-missing
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: epiresim --help

  conda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: conda-build
      - shell: bash -el {0}
        run: conda install --yes conda-build conda-verify
      - shell: bash -el {0}
        run: conda-build --channel conda-forge conda/recipe

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: epiresim:test
      - run: docker run --rm epiresim:test --help
